[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moove-recovery"
version = "0.1.0"
description = "Gestión local de alumnos, cuotas y cobranzas para MOOVE RECOVERY"
requires-python = ">=3.10,<3.15"
dependencies = [
  "cryptography==50.0.2",
  "PySide6==6.11.2",
  "argon2-cffi==25.1.0",
  "openpyxl==3.1.5",
  "reportlab==5.0.1",
  "tzdata==2026.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-qt==4.5.0",
  "ruff==0.16.10",
  "mypy==2.4.0",
]

[project.scripts]
moove-recovery = "moove_recovery.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
packages = ["moove_recovery.domain", "moove_recovery.application"]
