name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest
